[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "0.3.0"
description = "Adaptive Zero-Trust Security Control Plane for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MCP-Sentinel" }]
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "redis==5.2.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "cryptography==44.0.0",
  "structlog==24.4.0",
  "jsonschema==4.23.0",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
]
postgres = [
  "psycopg2-binary==2.9.10",
]

[project.scripts]
mcp-sentinel = "sentinel.cli:main"
mcp-sentinel-bridge = "sentinel.bridge:main"

[tool.setuptools.packages.find]
include = [
  "sentinel*",
  "identity*",
  "policy*",
  "risk*",
  "monitoring*",
  "integrity*",
  "workflow*",
  "mfa*",
  "dataflow*",
  "sandbox*",
  "mcp_servers*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
