server {
  listen 80;
  # Resolve the API service dynamically so nginx survives Sentinel container restarts
  # and recreated container IPs instead of failing at startup with "host not found".
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $sentinel_upstream sentinel:8443;

  # API (and the auth endpoints under /v1/auth)
  location /v1/ {
    proxy_pass http://$sentinel_upstream;
  }
  location /mcp {
    proxy_pass http://$sentinel_upstream;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location /health {
    proxy_pass http://$sentinel_upstream;
  }

  # Keep the slash redirect relative so Docker's published host port is preserved.
  location = /app {
    absolute_redirect off;
    return 308 /app/;
  }

  # Dashboard SPA (login-gated) at /app — built with Vite base "/app/".
  location /app/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /app/index.html;
  }

  # Landing + auth SPA at / (history routing: /auth/* falls back to its index.html).
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
