server {
  listen 80;

  # API (and the auth endpoints under /v1/auth)
  location /v1/ {
    proxy_pass http://sentinel:8443/v1/;
  }
  location /mcp {
    proxy_pass http://sentinel:8443/mcp;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location /health {
    proxy_pass http://sentinel:8443/health;
  }

  # Keep the slash redirect relative so Docker's published host port is preserved.
  location = /app {
    absolute_redirect off;
    return 308 /app/;
  }

  # Dashboard SPA (login-gated) at /app — built with Vite base "/app/".
  location /app/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /app/index.html;
  }

  # Landing + auth SPA at / (history routing: /auth/* falls back to its index.html).
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
